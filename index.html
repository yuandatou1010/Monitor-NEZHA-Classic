<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Monitor</title>

  <link rel="stylesheet" href="/assets/app.css">

  <style>
    /* 开场覆盖层，不影响原探针布局 */
    #chicken-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      transition: background-color 180ms ease;
    }

    /* 大号像素鸡，手机端自动缩小 */
    #pixel-chicken {
      position: relative;
      width: min(380px, 82vw);
      aspect-ratio: 20 / 18;
    }

    #pixel-chicken .chicken-pixel {
      position: absolute;
      width: 5.05%;
      height: 5.62%;
      background: var(--pixel-color);
    }

    /* 炸开时同步露出后面的探针 */
    #chicken-intro.burst {
      background-color: transparent;
      pointer-events: none;
    }

    #chicken-intro.burst .chicken-pixel {
      animation: chicken-burst 550ms cubic-bezier(.15,.65,.3,1) both;
    }

    @keyframes chicken-burst {
      from {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }

      to {
        opacity: 0;
        transform:
          translate(var(--dx), var(--dy))
          rotate(var(--rotation))
          scale(.25);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #chicken-intro.burst .chicken-pixel {
        animation: chicken-fade 180ms ease both;
      }

      @keyframes chicken-fade {
        to { opacity: 0; }
      }
    }
  </style>
</head>

<body>
  <div id="chicken-intro" aria-hidden="true">
    <div id="pixel-chicken"></div>
  </div>

  <main id="app"></main>

  <script>
    (() => {
      const overlay = document.getElementById("chicken-intro");
      const chicken = document.getElementById("pixel-chicken");

      /*
       * 点阵配色：
       * . 透明
       * K 黑色轮廓
       * W 米白色羽毛
       * G 灰色翅膀
       * R 红色鸡冠
       * Y 黄色嘴和脚
       */
      const drawing = [
        "....................",
        "............RR.R....",
        "...........RRRRR....",
        "...........KKKKK....",
        "..........KWWWWWK...",
        "..........KWWKWWK...",
        "..........KWWWWWKYY.",
        "..K.......KWWWWWKYY.",
        "..KK.....KWWWWWWK...",
        "..KWKKKKKWWWWWWRK...",
        "...KWWWWWWWWWWWRK...",
        "...KWWWWGGGWWWWK....",
        "...KWWWGGGGWWWWK....",
        "....KWWWGGWWWWK.....",
        ".....KKWWWWWKK......",
        ".......KKKKK........",
        "........Y.Y.........",
        ".......YY.YY........"
      ];

      const colors = {
        K: "#222222",
        W: "#f5f1e8",
        G: "#c9c6bd",
        R: "#e7473c",
        Y: "#efa62b"
      };

      try {
        const fragment = document.createDocumentFragment();

        drawing.forEach((row, y) => {
          [...row].forEach((color, x) => {
            if (!colors[color]) return;

            const pixel = document.createElement("span");
            pixel.className = "chicken-pixel";

            pixel.style.left = `${x * 5}%`;
            pixel.style.top = `${y / 18 * 100}%`;

            pixel.style.setProperty("--pixel-color", colors[color]);

            fragment.appendChild(pixel);
          });
        });

        chicken.appendChild(fragment);

        // 停留时间：1300 = 1.3 秒
        setTimeout(() => {
          try {
            const size = chicken.getBoundingClientRect();

            chicken.querySelectorAll(".chicken-pixel").forEach(pixel => {
              const x = parseFloat(pixel.style.left) / 100 * size.width;
              const y = parseFloat(pixel.style.top) / 100 * size.height;

              // 从鸡的中心向四周扩散，并增加少许随机偏移。
              const dx =
                (x - size.width / 2) * (2 + Math.random() * 2)
                + (Math.random() - .5) * 100;

              const dy =
                (y - size.height / 2) * (2 + Math.random() * 2)
                + (Math.random() - .5) * 100;

              pixel.style.setProperty("--dx", `${dx}px`);
              pixel.style.setProperty("--dy", `${dy}px`);
              pixel.style.setProperty(
                "--rotation",
                `${(Math.random() - .5) * 360}deg`
              );
            });

            overlay.classList.add("burst");
          } catch (error) {
            overlay.remove();
          }
        }, 1300);

        // 退场结束后移除，不留下透明遮罩。
        setTimeout(() => overlay.remove(), 1900);
      } catch (error) {
        // 动画异常时不阻挡探针。
        overlay.remove();
      }
    })();
  </script>

  <script src="/assets/app.js"></script>
  <script src="/assets/fold.js"></script>
</body>
</html>
