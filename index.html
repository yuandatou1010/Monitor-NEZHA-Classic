<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Monitor</title>

  <link rel="stylesheet" href="/assets/app.css">

  <style>
    /*
     * 隐藏探针但保留布局，便于读取真实尺寸。
     * CSS 也设置自动恢复，避免 JS 异常导致一直空白。
     */
    html.probe-intro-active #app {
      animation: probe-app-reveal 2000ms step-end forwards;
    }

    #probe-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: #fff;
      pointer-events: none;

      /* JS 之外的第二层保护 */
      animation: probe-overlay-hide 2000ms step-end forwards;
    }

    #probe-intro svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #probe-intro .probe-intro-line {
      fill: none;
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;

      stroke-dasharray: 1;
      stroke-dashoffset: 1;

      animation-name: probe-line-draw;
      animation-timing-function: linear;
      animation-fill-mode: both;
    }

    @keyframes probe-line-draw {
      from { stroke-dashoffset: 1; }
      to   { stroke-dashoffset: 0; }
    }

    @keyframes probe-app-reveal {
      from { visibility: hidden; }
      to   { visibility: visible; }
    }

    @keyframes probe-overlay-hide {
      from { visibility: visible; }
      to   { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      #probe-intro .probe-intro-line {
        animation: none !important;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <div id="probe-intro" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <main id="app"></main>

  <script>
    (() => {
      "use strict";

      /* ================= 配置区 ================= */

      const CONFIG = {
        // 总时长。若修改，也请同步修改 CSS 中的两个 2000ms。
        duration: 2200,

        // 提前画完，稍微展示一下完整线框。
        finishBefore: 200,

        // 检查实际布局的间隔，不产生网络请求。
        checkInterval: 100,

        // 是否绘制卡片标题下方的分隔线。
        drawHeaderLine: true,

        // 线条颜色。
        groupColor: "#dcdcdc",
        cardColor: "#dcdcdc",
        headerColor: "#dcdcdc"
      };

      /* =============== 配置区结束 =============== */

      const root = document.documentElement;
      const app = document.getElementById("app");
      const overlay = document.getElementById("probe-intro");
      const svg = overlay && overlay.querySelector("svg");

      const NS = "http://www.w3.org/2000/svg";

      let stopped = false;
      let intervalId = null;
      let endTimer = null;
      let lastSignature = "";

      const startedAt = performance.now();

      function cleanup() {
        stopped = true;

        clearInterval(intervalId);
        clearTimeout(endTimer);

        root.classList.remove("probe-intro-active");

        if (overlay) {
          overlay.remove();
        }
      }

      /*
       * 先设置结束保护，再执行任何绘图。
       * 绘图异常时也不会永久挡住页面。
       */
      endTimer = setTimeout(cleanup, CONFIG.duration);

      try {
        if (!app || !overlay || !svg) {
          cleanup();
          return;
        }

        root.classList.add("probe-intro-active");

        function inViewport(rect) {
          return (
            rect.width > 0 &&
            rect.height > 0 &&
            rect.right > 0 &&
            rect.bottom > 0 &&
            rect.left < window.innerWidth &&
            rect.top < window.innerHeight
          );
        }

        function readBox(element) {
          const rect = element.getBoundingClientRect();
          const style = getComputedStyle(element);

          return {
            x: rect.left,
            y: rect.top,
            width: rect.width,
            height: rect.height,
            radius: parseFloat(style.borderTopLeftRadius) || 0
          };
        }

        function readLayout() {
          const cards = Array.from(
            app.querySelectorAll(".card[data-id]")
          ).filter(card => {
            return (
              getComputedStyle(card).display !== "none" &&
              inViewport(card.getBoundingClientRect())
            );
          });

          if (!cards.length) return null;

          const groups = Array.from(
            app.querySelectorAll(".group")
          ).filter(group => {
            return (
              getComputedStyle(group).display !== "none" &&
              inViewport(group.getBoundingClientRect())
            );
          });

          return {
            width: window.innerWidth,
            height: window.innerHeight,

            groups: groups.map(readBox),

            cards: cards.map(card => {
              const result = readBox(card);
              const header = card.querySelector(".card-head");

              if (header && CONFIG.drawHeaderLine) {
                const rect = header.getBoundingClientRect();

                result.header = {
                  left: rect.left,
                  right: rect.right,
                  y: rect.bottom
                };
              }

              return result;
            })
          };
        }

        function appendPath(fragment, d, color, elapsed) {
          const path = document.createElementNS(NS, "path");

          path.setAttribute("d", d);
          path.setAttribute("class", "probe-intro-line");
          path.setAttribute("pathLength", "1");
          path.setAttribute("stroke", color);

          const drawDuration = Math.max(
            1,
            CONFIG.duration - CONFIG.finishBefore
          );

          path.style.animationDuration = `${drawDuration}ms`;

          /*
           * 负延迟：重新读取布局时沿用当前动画进度，
           * 不从头再画一次。
           */
          path.style.animationDelay = `${-elapsed}ms`;

          fragment.appendChild(path);
        }

        function drawBox(fragment, box, color, elapsed) {
          const x = box.x;
          const y = box.y;
          const right = x + box.width;
          const bottom = y + box.height;

          const middleX = x + box.width / 2;
          const middleY = y + box.height / 2;

          const radius = Math.max(
            0,
            Math.min(
              box.radius,
              box.width / 2,
              box.height / 2
            )
          );

          // 左侧中点 → 左上角 → 顶部中间
          appendPath(
            fragment,
            `
              M ${x} ${middleY}
              L ${x} ${y + radius}
              Q ${x} ${y} ${x + radius} ${y}
              L ${middleX} ${y}
            `,
            color,
            elapsed
          );

          // 右侧中点 → 右上角 → 顶部中间
          appendPath(
            fragment,
            `
              M ${right} ${middleY}
              L ${right} ${y + radius}
              Q ${right} ${y} ${right - radius} ${y}
              L ${middleX} ${y}
            `,
            color,
            elapsed
          );

          // 左侧中点 → 左下角 → 底部中间
          appendPath(
            fragment,
            `
              M ${x} ${middleY}
              L ${x} ${bottom - radius}
              Q ${x} ${bottom} ${x + radius} ${bottom}
              L ${middleX} ${bottom}
            `,
            color,
            elapsed
          );

          // 右侧中点 → 右下角 → 底部中间
          appendPath(
            fragment,
            `
              M ${right} ${middleY}
              L ${right} ${bottom - radius}
              Q ${right} ${bottom} ${right - radius} ${bottom}
              L ${middleX} ${bottom}
            `,
            color,
            elapsed
          );
        }

        function update() {
          if (stopped) return;

          try {
            const layout = readLayout();

            if (!layout) {
              if (lastSignature) {
                svg.replaceChildren();
                lastSignature = "";
              }
              return;
            }

            const signature = JSON.stringify(
              layout,
              (key, value) => {
                return typeof value === "number"
                  ? Math.round(value * 10) / 10
                  : value;
              }
            );

            if (signature === lastSignature) return;
            lastSignature = signature;

            const elapsed = performance.now() - startedAt;
            const fragment = document.createDocumentFragment();

            svg.setAttribute(
              "viewBox",
              `0 0 ${layout.width} ${layout.height}`
            );

            // 所有大框同时绘制。
            for (const group of layout.groups) {
              drawBox(
                fragment,
                group,
                CONFIG.groupColor,
                elapsed
              );
            }

            // 所有小卡片同时绘制，不排序、不设置分列延迟。
            for (const card of layout.cards) {
              drawBox(
                fragment,
                card,
                CONFIG.cardColor,
                elapsed
              );

              if (card.header) {
                const header = card.header;
                const middle = (header.left + header.right) / 2;

                // 分隔线左端 → 中间
                appendPath(
                  fragment,
                  `M ${header.left} ${header.y}
                   L ${middle} ${header.y}`,
                  CONFIG.headerColor,
                  elapsed
                );

                // 分隔线右端 → 中间
                appendPath(
                  fragment,
                  `M ${header.right} ${header.y}
                   L ${middle} ${header.y}`,
                  CONFIG.headerColor,
                  elapsed
                );
              }
            }

            svg.replaceChildren(fragment);
          } catch (error) {
            cleanup();
            console.warn("[线框开场] 绘制失败，已显示探针：", error);
          }
        }

        intervalId = setInterval(
          update,
          CONFIG.checkInterval
        );

        update();

      } catch (error) {
        cleanup();
        console.warn("[线框开场] 初始化失败，已显示探针：", error);
      }
    })();
  </script>

  <script src="/assets/app.js"></script>
  <script src="/assets/fold.js"></script>
</body>
</html>
