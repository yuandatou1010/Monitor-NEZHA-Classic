<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Monitor</title>

  <link rel="stylesheet" href="/assets/app.css">

  <style>
    /*
     * 保留真实布局，只隐藏内容。
     * 不使用 display:none，确保能读取卡片尺寸。
     */
    html.probe-intro-running #app {
      visibility: hidden;
    }

    #probe-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: #fff;
      pointer-events: none;
    }

    #probe-intro svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #probe-intro .intro-outline {
      fill: none;
      stroke: var(--intro-line-color, #bac8d0);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;

      stroke-dasharray: 1;
      stroke-dashoffset: 1;

      animation:
        probe-draw
        var(--draw-duration)
        linear
        var(--draw-delay)
        both;
    }

    @keyframes probe-draw {
      from { stroke-dashoffset: 1; }
      to   { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #probe-intro .intro-outline {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <div id="probe-intro" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <main id="app"></main>

  <script>
    (() => {
      "use strict";

      /* ================= 动画配置区 ================= */

      const CONFIG = {
        // 整体展示时间：3000 = 3 秒。
        duration: 2500,

        // 布局检查间隔，不产生网络请求。
        checkInterval: 100,

        // 是否绘制卡片名称下方的分隔线。
        drawHeaderLine: true,

        // 描线颜色。
        groupColor: "#c5cdd2",
        cardColor: "#b6c6d0",
        headerColor: "#dce3e7"
      };

      /*
       * 外框尺寸、卡片宽高、列数、间距、卡片数量：
       * 全部读取页面实际布局，不需要在这里重复配置。
       */

      /* =============== 配置区结束 =============== */

      const root = document.documentElement;
      const app = document.getElementById("app");
      const overlay = document.getElementById("probe-intro");
      const svg = overlay.querySelector("svg");
      const NS = "http://www.w3.org/2000/svg";

      let startedAt = 0;
      let signature = "";
      let intervalId;
      let endTimer;
      let stopped = false;

      function cleanup() {
        if (stopped) return;
        stopped = true;

        clearInterval(intervalId);
        clearTimeout(endTimer);

        root.classList.remove("probe-intro-running");
        overlay.remove();
      }

      function isVisible(rect) {
        return (
          rect.width > 0 &&
          rect.height > 0 &&
          rect.right > 0 &&
          rect.bottom > 0 &&
          rect.left < window.innerWidth &&
          rect.top < window.innerHeight
        );
      }

      function readBox(element) {
        const rect = element.getBoundingClientRect();
        const style = getComputedStyle(element);

        return {
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height,
          radius: parseFloat(style.borderTopLeftRadius) || 0
        };
      }

      function readLayout() {
        /*
         * 排除被 fold.js 隐藏的机器。
         * visibility:hidden 是我们设置的，不影响尺寸读取。
         */
        const cards = Array.from(
          app.querySelectorAll(".card[data-id]")
        ).filter(card => {
          return (
            getComputedStyle(card).display !== "none" &&
            isVisible(card.getBoundingClientRect())
          );
        });

        if (!cards.length) return null;

        const groups = Array.from(
          app.querySelectorAll(".group")
        ).filter(group => {
          return (
            getComputedStyle(group).display !== "none" &&
            isVisible(group.getBoundingClientRect())
          );
        });

        return {
          viewport: [window.innerWidth, window.innerHeight],

          groups: groups.map(readBox),

          cards: cards.map(card => {
            const result = readBox(card);
            const header = card.querySelector(".card-head");

            if (header && CONFIG.drawHeaderLine) {
              const rect = header.getBoundingClientRect();

              result.header = {
                x1: rect.left,
                x2: rect.right,
                y: rect.bottom
              };
            }

            return result;
          })
        };
      }

function addOutline(
  fragment,
  tag,
  attributes,
  color,
  start,
  duration,
  elapsed
) {
  /*
   * 所有框统一时间轴：
   * 同时开始，结束前留 100ms 完整展示。
   *
   * 忽略调用处原来的分列延迟，
   * 不必再修改下面的卡片排序代码。
   */
  const drawDuration = Math.max(1, CONFIG.duration - 100);

  function appendPath(d) {
    const path = document.createElementNS(NS, "path");

    path.setAttribute("d", d);
    path.setAttribute("class", "intro-outline");
    path.setAttribute("pathLength", "1");

    path.style.setProperty("--intro-line-color", color);
    path.style.setProperty(
      "--draw-duration",
      `${drawDuration}ms`
    );

    /*
     * 布局重新校正时继承当前进度，
     * 不重新从头播放。
     */
    path.style.setProperty(
      "--draw-delay",
      `${-elapsed}ms`
    );

    fragment.appendChild(path);
  }

  if (tag === "rect") {
    const x = Number(attributes.x);
    const y = Number(attributes.y);
    const width = Number(attributes.width);
    const height = Number(attributes.height);

    const right = x + width;
    const bottom = y + height;
    const centerX = x + width / 2;
    const centerY = y + height / 2;

    // 保留原卡片和外框的圆角。
    const radius = Math.max(
      0,
      Math.min(
        Number(attributes.rx) || 0,
        width / 2,
        height / 2
      )
    );

    /*
     * 将边框拆成四条路径。
     * 左右侧中点同时出发，
     * 最终在顶部中间、底部中间汇合。
     */

    // 左侧中点 → 左上角 → 顶部中间
    appendPath(`
      M ${x} ${centerY}
      L ${x} ${y + radius}
      Q ${x} ${y} ${x + radius} ${y}
      L ${centerX} ${y}
    `);

    // 右侧中点 → 右上角 → 顶部中间
    appendPath(`
      M ${right} ${centerY}
      L ${right} ${y + radius}
      Q ${right} ${y} ${right - radius} ${y}
      L ${centerX} ${y}
    `);

    // 左侧中点 → 左下角 → 底部中间
    appendPath(`
      M ${x} ${centerY}
      L ${x} ${bottom - radius}
      Q ${x} ${bottom} ${x + radius} ${bottom}
      L ${centerX} ${bottom}
    `);

    // 右侧中点 → 右下角 → 底部中间
    appendPath(`
      M ${right} ${centerY}
      L ${right} ${bottom - radius}
      Q ${right} ${bottom} ${right - radius} ${bottom}
      L ${centerX} ${bottom}
    `);

    return;
  }

  if (tag === "line") {
    const x1 = Number(attributes.x1);
    const y1 = Number(attributes.y1);
    const x2 = Number(attributes.x2);
    const y2 = Number(attributes.y2);

    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;

    // 分隔线：左右两端同时向中间汇合。
    appendPath(`
      M ${x1} ${y1}
      L ${centerX} ${centerY}
    `);

    appendPath(`
      M ${x2} ${y2}
      L ${centerX} ${centerY}
    `);
  }
}
  </script>

  <script src="/assets/app.js"></script>
  <script src="/assets/fold.js"></script>
</body>
</html>
