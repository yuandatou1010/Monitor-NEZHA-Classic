<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Monitor</title>

  <link rel="stylesheet" href="/assets/app.css">

  <style>
    /*
     * 保留真实布局，只隐藏内容。
     * 不使用 display:none，确保能读取卡片尺寸。
     */
    html.probe-intro-running #app {
      visibility: hidden;
    }

    #probe-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: #fff;
      pointer-events: none;
    }

    #probe-intro svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #probe-intro .intro-outline {
      fill: none;
      stroke: var(--intro-line-color, #bac8d0);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;

      stroke-dasharray: 1;
      stroke-dashoffset: 1;

      animation:
        probe-draw
        var(--draw-duration)
        linear
        var(--draw-delay)
        both;
    }

    @keyframes probe-draw {
      from { stroke-dashoffset: 1; }
      to   { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #probe-intro .intro-outline {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <div id="probe-intro" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <main id="app"></main>

  <script>
    (() => {
      "use strict";

      /* ================= 动画配置区 ================= */

      const CONFIG = {
        // 整体展示时间：3000 = 3 秒。
        duration: 3000,

        // 布局检查间隔，不产生网络请求。
        checkInterval: 100,

        // 是否绘制卡片名称下方的分隔线。
        drawHeaderLine: true,

        // 描线颜色。
        groupColor: "#c5cdd2",
        cardColor: "#b6c6d0",
        headerColor: "#dce3e7"
      };

      /*
       * 外框尺寸、卡片宽高、列数、间距、卡片数量：
       * 全部读取页面实际布局，不需要在这里重复配置。
       */

      /* =============== 配置区结束 =============== */

      const root = document.documentElement;
      const app = document.getElementById("app");
      const overlay = document.getElementById("probe-intro");
      const svg = overlay.querySelector("svg");
      const NS = "http://www.w3.org/2000/svg";

      let startedAt = 0;
      let signature = "";
      let intervalId;
      let endTimer;
      let stopped = false;

      function cleanup() {
        if (stopped) return;
        stopped = true;

        clearInterval(intervalId);
        clearTimeout(endTimer);

        root.classList.remove("probe-intro-running");
        overlay.remove();
      }

      function isVisible(rect) {
        return (
          rect.width > 0 &&
          rect.height > 0 &&
          rect.right > 0 &&
          rect.bottom > 0 &&
          rect.left < window.innerWidth &&
          rect.top < window.innerHeight
        );
      }

      function readBox(element) {
        const rect = element.getBoundingClientRect();
        const style = getComputedStyle(element);

        return {
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height,
          radius: parseFloat(style.borderTopLeftRadius) || 0
        };
      }

      function readLayout() {
        /*
         * 排除被 fold.js 隐藏的机器。
         * visibility:hidden 是我们设置的，不影响尺寸读取。
         */
        const cards = Array.from(
          app.querySelectorAll(".card[data-id]")
        ).filter(card => {
          return (
            getComputedStyle(card).display !== "none" &&
            isVisible(card.getBoundingClientRect())
          );
        });

        if (!cards.length) return null;

        const groups = Array.from(
          app.querySelectorAll(".group")
        ).filter(group => {
          return (
            getComputedStyle(group).display !== "none" &&
            isVisible(group.getBoundingClientRect())
          );
        });

        return {
          viewport: [window.innerWidth, window.innerHeight],

          groups: groups.map(readBox),

          cards: cards.map(card => {
            const result = readBox(card);
            const header = card.querySelector(".card-head");

            if (header && CONFIG.drawHeaderLine) {
              const rect = header.getBoundingClientRect();

              result.header = {
                x1: rect.left,
                x2: rect.right,
                y: rect.bottom
              };
            }

            return result;
          })
        };
      }

      function addOutline(
        fragment,
        tag,
        attributes,
        color,
        start,
        duration,
        elapsed
      ) {
        const element = document.createElementNS(NS, tag);

        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, value);
        }

        element.setAttribute("class", "intro-outline");
        element.setAttribute("pathLength", "1");

        element.style.setProperty("--intro-line-color", color);
        element.style.setProperty("--draw-duration", `${duration}ms`);

        /*
         * 布局变化后仍沿用同一条时间轴，
         * 不会每次校正都重新从头画。
         */
        element.style.setProperty(
          "--draw-delay",
          `${start - elapsed}ms`
        );

        fragment.appendChild(element);
      }

      function update() {
        if (stopped) return;

        try {
          const layout = readLayout();

          // 数据尚未返回时，不画虚假的一行卡片。
          if (!layout) {
            if (signature) {
              svg.replaceChildren();
              signature = "";
            }
            return;
          }

          /*
           * 将坐标精度限制到 0.1px，
           * 避免无意义的小数变化导致重复绘制。
           */
          const nextSignature = JSON.stringify(
            layout,
            (key, value) => {
              return typeof value === "number"
                ? Math.round(value * 10) / 10
                : value;
            }
          );

          if (nextSignature === signature) return;
          signature = nextSignature;

          const elapsed = performance.now() - startedAt;
          const drawTime = Math.max(1, CONFIG.duration - 100);
          const fragment = document.createDocumentFragment();

          svg.setAttribute(
            "viewBox",
            `0 0 ${window.innerWidth} ${window.innerHeight}`
          );

          // 外框与卡片共同描绘，结束前留 100ms 完整展示。
          for (const rect of layout.groups) {
            addOutline(
              fragment,
              "rect",
              {
                x: rect.x,
                y: rect.y,
                width: rect.width,
                height: rect.height,
                rx: rect.radius
              },
              CONFIG.groupColor,
              0,
              drawTime,
              elapsed
            );
          }

          /*
           * 按横向位置决定开始时间：
           * 同一列同时开始，左侧早于右侧。
           */
          const minX = Math.min(...layout.cards.map(card => card.x));
          const maxX = Math.max(...layout.cards.map(card => card.x));
          const range = maxX - minX;

          for (const card of layout.cards) {
            const progress = range > 0
              ? (card.x - minX) / range
              : 0;

            const start = progress * drawTime * 0.5;
            const duration = drawTime - start;

            addOutline(
              fragment,
              "rect",
              {
                x: card.x,
                y: card.y,
                width: card.width,
                height: card.height,
                rx: card.radius
              },
              CONFIG.cardColor,
              start,
              duration,
              elapsed
            );

            if (card.header) {
              addOutline(
                fragment,
                "line",
                {
                  x1: card.header.x1,
                  y1: card.header.y,
                  x2: card.header.x2,
                  y2: card.header.y
                },
                CONFIG.headerColor,
                start + duration * 0.35,
                duration * 0.65,
                elapsed
              );
            }
          }

          svg.replaceChildren(fragment);
        } catch (error) {
          cleanup();
          console.warn("[线框开场] 已跳过：", error);
        }
      }

      try {
        root.classList.add("probe-intro-running");
        startedAt = performance.now();

        update();

        // 只检查页面布局，不访问任何接口。
        intervalId = setInterval(
          update,
          CONFIG.checkInterval
        );

        // 到时直接显示真实探针，不做粘合或移动效果。
        endTimer = setTimeout(cleanup, CONFIG.duration);
      } catch (error) {
        cleanup();
      }
    })();
  </script>

  <script src="/assets/app.js"></script>
  <script src="/assets/fold.js"></script>
</body>
</html>
